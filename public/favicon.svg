<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56">
  <title>Bijles Bèta</title>
  <!--
    The Bijles Bèta mark. The artwork is 43.12 x 52.41, so it is centred on a
    square canvas here rather than left to be squashed into a favicon slot.

    `cls-1` lifts to parchment on a dark browser theme; the deep ink all but
    disappears against a dark tab strip otherwise, leaving only the amber half
    of the mark legible.
  -->
  <style>
    .cls-1 { fill: #1d1d1b; }
    .cls-2 { fill: #f3be06; }
    @media (prefers-color-scheme: dark) {
      .cls-1 { fill: #f5f3e9; }
    }
  </style>
